name: 🚀 Auto Deploy — Frontend (Vercel) + Backend (Render)

# Trigger on every push to main branch
on:
  push:
    branches:
      - main
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Deploy Frontend to Vercel
  # Vercel auto-deploys via GitHub integration,
  # this job just confirms the build passes first.
  # ─────────────────────────────────────────────
  deploy-frontend:
    name: 🌐 Frontend → Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build (verify no build errors)
        env:
          VITE_API_URL: https://my-portfolio-svqe.onrender.com
        run: npm run build

      - name: ✅ Frontend build succeeded
        run: echo "Frontend built successfully — Vercel will pick up the push automatically."

  # ─────────────────────────────────────────────
  # JOB 2: Deploy Backend to Render
  # Triggers Render redeploy via Deploy Hook URL
  # stored as a GitHub secret: RENDER_DEPLOY_HOOK_URL
  # ─────────────────────────────────────────────
  deploy-backend:
    name: ⚙️ Backend → Render
    runs-on: ubuntu-latest
    # Only runs after frontend build succeeds
    needs: deploy-frontend

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: 🔍 Verify backend syntax (no crashes on startup)
        working-directory: backend
        run: node -e "require('./utils/mailer.js'); require('./routes/contact.js'); console.log('✅ Backend modules load OK')"

      - name: 🚀 Trigger Render redeploy
        # Only runs if RENDER_DEPLOY_HOOK_URL secret is set in GitHub repo
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          echo "Triggering Render backend redeploy..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 201 ]; then
            echo "✅ Render deploy triggered successfully (HTTP $RESPONSE)"
          else
            echo "⚠️ Render deploy hook returned HTTP $RESPONSE (may still be deploying)"
          fi

      - name: ℹ️ Render deploy hook not configured
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "ℹ️ RENDER_DEPLOY_HOOK_URL secret not set."
          echo "Render will auto-redeploy if connected to this GitHub repo natively."
          echo "To enable: Go to Render Dashboard → your service → Settings → Deploy Hook"
          echo "Then add the URL as a GitHub secret named RENDER_DEPLOY_HOOK_URL"

  # ─────────────────────────────────────────────
  # JOB 3: Health check after deploy
  # Waits 30s for Render to wake up, then pings
  # ─────────────────────────────────────────────
  health-check:
    name: 🏥 Health Check
    runs-on: ubuntu-latest
    needs: deploy-backend
    # Run even if backend job had warnings
    if: always()

    steps:
      - name: ⏳ Wait for Render to deploy (30s)
        run: sleep 30

      - name: 🏥 Ping backend health endpoint
        run: |
          echo "Checking https://my-portfolio-svqe.onrender.com/health ..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            --max-time 60 \
            https://my-portfolio-svqe.onrender.com/health)
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Status: $HTTP_STATUS"
          echo "Response: $BODY"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Backend is live and healthy!"
          else
            echo "⚠️ Backend returned HTTP $HTTP_STATUS — may still be warming up (Render free tier cold start)"
          fi

      - name: 📊 Deployment summary
        run: |
          echo "════════════════════════════════════════"
          echo "  🎉 DEPLOYMENT COMPLETE"
          echo "════════════════════════════════════════"
          echo "  Frontend: https://myportfolio-rust-three-36.vercel.app"
          echo "  Backend:  https://my-portfolio-svqe.onrender.com"
          echo "════════════════════════════════════════"
